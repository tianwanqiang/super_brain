<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>公众号草稿预览 · super_brain</title>
<style>
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; max-width: 760px; margin: 30px auto; padding: 0 20px; color: #1b2028; background: #f5f6f8; }
  .path-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: #666; margin-bottom: 8px; }
  .path-row code { background: #eef0f3; padding: 3px 8px; border-radius: 4px; word-break: break-all; }
  button { padding: 5px 12px; border: 1px solid #0e6e76; border-radius: 4px; background: #fff; color: #0e6e76; font-size: 12.5px; cursor: pointer; }
  button:hover { background: #0e6e76; color: #fff; }
  .disclaimer { font-size: 12px; color: #a35b00; background: #fdecd2; border: 1px solid #f0cf94; border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
  .preview-frame { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 24px; }
  a.back { font-size: 12.5px; color: #666; text-decoration: none; }
  a.back:hover { color: #0e6e76; text-decoration: underline; }
</style>
</head>
<body>

<p><a class="back" href="{{ url_for('index') }}">← 返回决策圆桌</a></p>
<div class="path-row">
  存放位置：<code id="pathText">{{ path }}</code>
  <button id="copyBtn" type="button">复制路径</button>
</div>
<div class="disclaimer">这是排版效果预览，实际公众号客户端渲染可能有细微差异（字体、间距等），最终以公众号后台草稿箱里的效果为准。</div>
<div class="preview-frame">{{ content | safe }}</div>

<script>
  document.getElementById('copyBtn').addEventListener('click', function () {
    var btn = this;
    navigator.clipboard.writeText(document.getElementById('pathText').textContent).then(function () {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制路径'; }, 1500);
    });
  });
</script>

</body>
</html>
