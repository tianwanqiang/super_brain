name: Deploy super_brain to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 让代码/日志目录落在本机检出路径内，而不是回落到任何本机默认路径——
      # 避免把开发者本地路径（如 G:\code\...）泄漏进 CI 日志/失败信息。
      SUPER_BRAIN_DIR: ${{ github.workspace }}
      OPC_ROOT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（含 requirements.txt + pytest，不影响生产镜像——Dockerfile 只装 requirements.txt）
        run: pip install -r requirements-dev.txt

      - name: 跑单元测试（tests/，全部零成本，不碰真实 API/凭据）
        run: python -m pytest -q

  deploy:
    needs: test  # 测试没过，这个 job 不会跑，服务器上的代码不会被这次改动覆盖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 调试 - 打印这次运行的出口 IP（用于跟服务器安全告警的 IP 核对）
        run: |
          echo "这台 GitHub Actions 运行环境的出口 IP："
          curl -s https://api.ipify.org
          echo ""

      # 方案 C：Actions 直推服务器。代码从 Actions checkout（就是本次 commit），
      # 经 rsync/SSH 直接同步到服务器——服务器完全不访问 GitHub，无代理/封锁问题。
      - name: rsync 同步代码到服务器（服务器不碰 GitHub）
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/super_brain_deploy
          chmod 600 ~/.ssh/super_brain_deploy
          HOST="${{ secrets.SERVER_HOST }}"
          USER="${{ secrets.SERVER_USER }}"
          DEST="${{ secrets.SERVER_DEPLOY_PATH }}"
          SSH_OPTS="-i ~/.ssh/super_brain_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          # 服务器上没有 rsync 就先装（用户通常是 root；非 root 且无 sudo 时请预装一次）
          ssh $SSH_OPTS "$USER@$HOST" \
            "command -v rsync >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq rsync; }" \
            || ssh $SSH_OPTS "$USER@$HOST" \
            "command -v rsync >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rsync; }"

          rsync -az --delete --checksum \
            -e "ssh -i ~/.ssh/super_brain_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude-from=.github/deploy-exclude.txt \
            ./ "$USER@$HOST:$DEST/"
          echo "[deploy] rsync 完成（commit: ${{ github.sha }}）"

      - name: 服务器本地校验配置并重启容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.SERVER_DEPLOY_PATH }}"

            # 校验服务器上真实的 config.json——这是 GitHub Actions 那个 test job 做不到的事，
            # 那个 job 跑在云端全新 checkout 出来的仓库里，物理上碰不到这台服务器的真实文件。
            # 这里直接在服务器本机、对着真实文件跑（不在容器里跑：容器这时候还没重建，且这个
            # 检查本身只依赖标准库，host 上的 python3 就够）。SUPER_BRAIN_DIR 显式指向部署目录，
            # 不依赖任何环境变量默认值——检查不过（比如 DEEPSEEK_API_KEY 缺失/config.json 损坏），
            # `set -e` 会让整个脚本在这一步中止，不会往下重启服务，避免用一份坏配置重启线上服务。
            SUPER_BRAIN_DIR="${{ secrets.SERVER_DEPLOY_PATH }}" python3 config_check.py

            docker compose up -d --build
