# super_brain agent 注册表——统一格式，所有 agent 的元信息集中在这里
#
# 本文件是枚举"合法 agent 有哪些"的权威来源——ui_app.py / executors.py / workflow.py 都从
# 这里读取 agent 元信息，不再靠扫描 agents/ 目录（目录存在不代表已经正式注册）。
# 手动编排圆桌讨论（比如临时用 Agent 工具唤起专家）时，也应该从这里读 sources/
# output_requires_citation 这些字段去拼 prompt，不要每次手写。
#
# 字段说明：
#   name                     agent 标识，必须和 agents/<name>/ 目录名一致
#   type                     execution（专精执行，如 ship）/ coordinator（协调型）/
#                            roundtable（A 类决策圆桌专家）/ coach（B 类能力建设型，暂无实例）
#   description              一句话说明这个 agent 是干什么的，供选择界面/触发逻辑用
#   knowledge_path           private.md 的相对路径（相对本文件所在目录）
#   sources                  仅 roundtable 类型需要——知识框架的来源书籍/理论体系，用于可审计
#   output_requires_citation 仅 roundtable 类型需要——是否要求每条结论标注依据第几条规则
#   disclaimer_required      仅涉及专业资质敏感领域（如法律）需要——是否强制要求免责措辞
#   executor                 仅少数 agent 需要——对应 executors.py 里一个真实执行函数的 key，
#                            有这个字段的 agent，由 digest.py 的每日批处理或对话内 @ 直接调用
#                            该函数落地动作（建草稿，不涉及群发/发布），而不是只调 DeepSeek
#                            起草建议文字。没有这个字段的 agent（比如 ship、roundtable 类型），
#                            保持原有的"只起草建议"行为不变。
#
# 设计原则（2026-08-15 确认，别混用）：
#   - 工具类助手（toutiao / ops-assistant 这类）：动作是确定性的、机械的，不需要"独立判断"
#     这个环节，最好的实现是由 executors.py 直接调用对应函数（executor 字段），不要套异步
#     留言协议——那套协议是为"不需要人干等"设计的，用在这里只会徒增一次读写文件和状态机
#     维护的成本，换不来任何东西。
#   - 圆桌讨论 agent（roundtable 类型）：价值恰恰来自"真正独立的推理过程"本身，不能用
#     executor 简化成直接函数调用——那样会把它们退化成工具类助手，丢掉圆桌讨论最核心的
#     东西（独立视角之间真实的交叉校验）。roundtable 类型的 agent 不应该加 executor 字段。

version: 1

agents:
  - name: ship
    type: execution
    description: 推代码到 GitHub（git 任务）+ 生成公众号文章草稿（wechat 任务），不涉及自动发布/群发
    knowledge_path: agents/ship/private.md

  - name: coordinator
    type: coordinator
    description: 架构设计、任务拆解、调度专精 agent，对应用户主力沟通的这条对话线
    knowledge_path: agents/coordinator/private.md

  - name: strategy
    type: roundtable
    description: 战略与博弈分析——服务定价、竞争应对、谈判、市场进入时机这类决策
    knowledge_path: agents/strategy/private.md
    sources:
      - "Avinash Dixit & Barry Nalebuff《策略思维》Thinking Strategically"
      - "Michael Porter《竞争战略》Competitive Strategy"
      - "《孙子兵法》原典 + 宫玉振《善战者说》"
      - "Richard Rumelt《好战略/坏战略》Good Strategy Bad Strategy"
      - "W. Chan Kim & Renée Mauborgne《蓝海战略》Blue Ocean Strategy"
    output_requires_citation: true

  - name: finance
    type: roundtable
    description: 财务与单位经济学——服务定价、成本结构、现金流、投入取舍这类决策
    knowledge_path: agents/finance/private.md
    sources:
      - "硅谷创业/精益创业方法论体系（CAC/LTV 单位经济学框架）"
      - "财务报表三表联动分析法（资产负债表/利润表/现金流量表）"
      - "薛兆丰《经济学讲义》"
      - "Eric Ries《精益创业》The Lean Startup"
      - "Peter Thiel《从0到1》Zero to One"
    output_requires_citation: true

  - name: marketing
    type: roundtable
    description: 营销策略与传播心理——只产出"该往哪个方向讲"的策略判断，不负责执行/发布
    knowledge_path: agents/marketing/private.md
    sources:
      - "Al Ries & Jack Trout《定位》Positioning、《商战》Marketing Warfare"
      - "Jonah Berger《疯传》/ 格拉德威尔《引爆点》"
      - "Daniel Kahneman《思考，快与慢》Thinking, Fast and Slow"
      - "Robert Cialdini《影响力》Influence"
      - "Nir Eyal《上瘾》Hooked"
    output_requires_citation: true

  - name: legal
    type: roundtable
    description: 法律与合规风险识别——只做风险提示，不做正式法律结论
    knowledge_path: agents/legal/private.md
    sources:
      - "中国《公司法》一人有限责任公司相关条款"
      - "一人公司常见合规风险公开案例整理（非执业律师意见）"
      - "《广告法》实务解读（内容合规专项）"
      - "《个人信息保护法》PIPL 实务（数据合规专项）"
    output_requires_citation: true
    disclaimer_required: true

  - name: aigc-trends
    type: roundtable
    description: AIGC 趋势与最佳实践——判断某个生成式 AI 趋势/工具/打法值不值得跟进，兼顾战略布道和技术落地指导
    knowledge_path: agents/aigc-trends/private.md
    sources:
      - "李开复《AI·未来》AI Superpowers"
      - "李开复、陈楸帆《AI 2041：10个未来场景》"
      - "Kevin Kelly《必然》The Inevitable"
      - "Andrew Ng 公开方法论（The Batch newsletter / AI Transformation Playbook）"
    output_requires_citation: true

  - name: commercialization
    type: roundtable
    description: super_brain 自身的产品化判断——这套系统该怎么迭代才有真实商业价值，不分析 CEO 其他生意的通用战略
    knowledge_path: agents/commercialization/private.md
    sources:
      - "Rob Fitzpatrick《提问的艺术》The Mom Test"
      - "April Dunford《Obviously Awesome》"
      - "独立开发者社区常见产品化打法（MicroConf / Indie Hackers 系）"
    output_requires_citation: true

  - name: toutiao
    type: execution
    description: 生成头条号文章草稿（调用 G:\code\toutiao-agent 的 DeepSeek 逻辑），不涉及登录/发布
    knowledge_path: agents/toutiao/private.md
    executor: toutiao_draft

  - name: content-strategist
    type: execution
    description: writer/toutiao/video-prompt 生成正式内容前的上游规划——产出策划简报（钩子/节奏/取舍），不产出成品文案，由 executors.py 在生成头条/公众号文案前自动调用
    knowledge_path: agents/content-strategist/private.md

  - name: writer
    type: execution
    description: 把圆桌讨论的原始记录写成正式会议纪要（{date_time}_{title}.md），对话内 @ 触发
    knowledge_path: agents/writer/private.md

  - name: video-prompt
    type: execution
    description: 把中文描述转成视频生成大模型的提示词（目前专精 Seedance 2.0），对话内 @ 触发
    knowledge_path: agents/video-prompt/private.md

  - name: ops-assistant
    type: execution
    description: 读取当天的 opc 内容 + 会议纪要目录里的新文件，分发到头条和公众号生成待审阅草稿；默认两个平台都发，不自动发布/群发
    knowledge_path: agents/ops-assistant/private.md
    executor: ops_assistant_full

# ---- 自动化媒体发布流水线角色（2026-09 新增，autopublish.py 骨架）----
# 这四个角色属于"发布侧"流水线：物料制作(draft) -> 人工放行(approve) -> 定时发布(dispatch)。
# 跟上面老角色的分工差异：ops-assistant 是把"当天沉淀内容"一次性分发成待审阅草稿的旧路径；
# 这里是对"发布单"做有状态、带调度、可重试的流水线。流水线的每个环节在 autopublish.py 里
# 是确定性的 Python 函数 + 人工闸门。
# 设计说明：
#   - publish-planner / gatekeeper 没有 executor：planner 目前只有默认路由（建单时选好的
#     渠道），gatekeeper 的"放行/打回"是后台的人工按钮，两者不需要被自动触发。
#   - media-maker / publisher 有 executor（对应 executors.py 里两个真实函数），可由每日
#     批处理或对话内 @ 直接调用，处理当天待生产/待发布的发布单。

  - name: publish-planner
    type: execution
    description: 发布流水线排期与路由——素材入池时决定发哪些渠道/什么档期，产出发布单；目前是默认路由（人工建单时定渠道），以后接素材自动决策
    knowledge_path: agents/publish-planner/private.md

  - name: media-maker
    type: execution
    description: 为发布单制作可发布物料——文章本地定稿（零成本）/推送公众号草稿/视频生成 provider 调度；只生产，不发布
    knowledge_path: agents/media-maker/private.md
    executor: media_maker_pending

  - name: gatekeeper
    type: execution
    description: 发布前质检与放行闸门——审核物料，可打回；真正"批准发布"永远由 CEO 在后台逐渠道人工确认
    knowledge_path: agents/gatekeeper/private.md

  - name: publisher
    type: execution
    description: 按发布单把已放行且到点的内容发布到各平台——受全局主开关+渠道 mode+CEO 放行三重闸门约束；没有自动发布能力的渠道如实标记 needs_manual
    knowledge_path: agents/publisher/private.md
    executor: publisher_dispatch

# ---- 内容产出流水线角色（2026-09 新增，content_pipeline.py）----
# 跟"发布侧"那四个角色互补：这里补的是内容生产侧。writer 直接复用上面已注册的
# writer/content-strategist，不重复注册。
# 设计说明：researcher/critic 的推理引擎在 content_pipeline.py（流水线编排内直接调用），
# 同时给它们注册了 executor——workflow.py 的内容工作流编排会直接调用这些函数跑单次真实
# 执行：researcher 把选题跑一次信息搜集，critic 把定稿跑一次点评，无需异步留言中转。

  - name: researcher
    type: execution
    description: 内容流水线——选题→联网搜索(RAG 降级)→产出逐条带来源的信息包(Fact Package)；代码层红线：无来源事实直接丢弃
    knowledge_path: agents/researcher/private.md
    executor: researcher_apply

  - name: critic
    type: execution
    description: 内容流水线——对 writer 定稿出量化评分卡意见单(钩子/密度/事实风险/平台适配)，只点评不改稿；verdict=accept/revise/reject
    knowledge_path: agents/critic/private.md
    executor: critic_review
