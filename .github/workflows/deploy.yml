name: Deploy super_brain to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 让代码/日志目录落在本机检出路径内，而不是回落到任何本机默认路径——
      # 避免把开发者本地路径（如 G:\code\...）泄漏进 CI 日志/失败信息。
      SUPER_BRAIN_DIR: ${{ github.workspace }}
      OPC_ROOT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（含 requirements.txt + pytest，不影响生产镜像——Dockerfile 只装 requirements.txt）
        run: pip install -r requirements-dev.txt

      - name: 跑单元测试（tests/，全部零成本，不碰真实 API/凭据）
        run: python -m pytest -q

  deploy:
    needs: test  # 测试没过，这个 job 不会跑，服务器上的代码不会被这次改动覆盖
    runs-on: ubuntu-latest
    steps:
      - name: 调试 - 打印这次运行的出口 IP（用于跟服务器安全告警的 IP 核对）
        run: |
          echo "这台 GitHub Actions 运行环境的出口 IP："
          curl -s https://api.ipify.org
          echo ""

      - name: SSH 到服务器拉最新代码并重启容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 默认 10 分钟——2026-09-02 那次被打断是因为当时还依赖 torch/sentence-transformers，
          # 这两个重依赖已经在 2026-09-03 换成阿里云 DashScope/DashVector 云端服务后移除，
          # 现在 docker build 应该明显更快；30m 留着是保守冗余，不是仍然需要这么久。
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.SERVER_DEPLOY_PATH }}"

            # 国内服务器直连 github.com 经常断（443 超时）——支持可选代理 secret，
            # 并在仓库 secret 里配了 SERVER_HTTPS_PROXY 时自动走代理。
            if [ -n "${{ secrets.SERVER_HTTPS_PROXY }}" ]; then
              export https_proxy="${{ secrets.SERVER_HTTPS_PROXY }}"
              export http_proxy="${{ secrets.SERVER_HTTPS_PROXY }}"
              echo "使用代理拉取代码"
            fi

            # git fetch 加重试 + 低网速容忍（github 被墙/波动时一次失败就退出太脆）
            FETCH_OK=0
            for i in 1 2 3 4 5; do
              echo "[deploy] git fetch 第 $i/5 次..."
              if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 fetch origin main; then
                FETCH_OK=1
                break
              fi
              sleep 12
            done
            if [ "$FETCH_OK" != "1" ]; then
              echo "[deploy] 连续 5 次连不上 github.com（或你配置的镜像），中止部署——服务保持旧版本运行。"
              exit 1
            fi
            git reset --hard origin/main

            # 校验服务器上真实的 config.json——这是 GitHub Actions 那个 test job 做不到的事，
            # 那个 job 跑在云端全新 checkout 出来的仓库里，物理上碰不到这台服务器的真实文件。
            # 这里直接在服务器本机、对着真实文件跑（不在容器里跑：容器这时候还没重建，且这个
            # 检查本身只依赖标准库，host 上的 python3 就够）。SUPER_BRAIN_DIR 显式指向部署目录，
            # 不依赖任何环境变量默认值——检查不过（比如 DEEPSEEK_API_KEY 缺失/config.json 损坏），
            # `set -e` 会让整个脚本在这一步中止，不会往下重启服务，避免用一份坏配置重启线上服务。
            SUPER_BRAIN_DIR="${{ secrets.SERVER_DEPLOY_PATH }}" python3 config_check.py

            docker compose up -d --build
